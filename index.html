<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Snippet Vault</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>{ Snippet Vault }</h1>
        <button id="theme-toggle">🌙 Dark Mode</button>
    </header>

    <main>
        <section class="form-section">
            <form id="snippet-form">
                <input type="text" id="snippet-title" placeholder="Snippet Title (e.g., Git Undo)" required>
                <textarea id="snippet-code" rows="5" placeholder="Paste your code or bash commands here..." required></textarea>
                <button type="submit">Save Snippet</button>
            </form>
        </section>

        <section id="vault-grid" class="vault-grid">
            <!-- Snippet cards will be injected here by JavaScript -->
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
